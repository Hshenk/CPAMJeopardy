<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAM Jeopardy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="panel">
    <header class="title">
      <p class="title__museum">College Park Aviation Museum</p>
      <h1 class="title__game">Jeopardy</h1>
    </header>

    <!-- Setup screen: pick question set, max points and categories, then start -->
    <section id="setup-screen" class="screen setup">
      <h2 class="banner">New Game</h2>

      <div class="setup__fields">
        <div class="setup__row">
          <fieldset class="setup__field setup__group">
            <legend>Difficulty</legend>
            <!-- value matches a key in QUESTION_BANK.pools -->
            <div id="pool-options" class="option-list">
              <label class="option-chip">
                <input type="radio" name="question-pool" value="easy" checked>
                <span>Easy</span>
              </label>
              <label class="option-chip">
                <input type="radio" name="question-pool" value="hard">
                <span>Hard</span>
              </label>
            </div>
          </fieldset>

          <div class="setup__field">
            <label for="max-difficulty">Max points</label>
            <select id="max-difficulty">
              <option value="1">200</option>
              <option value="2">400</option>
              <option value="3" selected>600</option>
              <option value="4">800</option>
              <option value="5">1000</option>
            </select>
          </div>
        </div>

        <fieldset class="setup__field setup__group setup__categories">
          <legend>Categories</legend>
          <!-- One checkbox per category, built by JS from QUESTION_BANK -->
          <div id="category-list" class="option-list"></div>
        </fieldset>
      </div>

      <p id="setup-error" class="setup__error" hidden>Pick at least one category.</p>

      <button id="start-button" class="button" type="button">Start Game</button>
    </section>

    <!-- Board screen: category columns and point tiles are built by JS -->
    <section id="board-screen" class="screen" hidden>
      <div id="board" class="board"></div>

      <div class="screen-actions">
        <button id="new-board-button" class="button button--secondary" type="button">New Board</button>
      </div>
    </section>

    <!-- Question screen: filled in by JS when a tile is clicked -->
    <section id="question-screen" class="screen question" hidden>
      <div class="question__card">
        <h2 class="question__label">
          <span id="question-category"></span>
          <span id="question-value"></span>
        </h2>

        <p id="question-text" class="question__text"></p>

        <img id="question-image" class="question__image" alt="" hidden>

        <ol id="question-choices" class="question__choices" type="A" hidden></ol>

        <div id="answer-box" class="answer" hidden>
          <p class="answer__label">Answer</p>
          <p id="answer-text" class="answer__text"></p>
        </div>
      </div>

      <div class="screen-actions">
        <button id="show-answer-button" class="button" type="button">Show Answer</button>
        <button id="back-to-board-button" class="button button--secondary" type="button">Back to Board</button>
      </div>
    </section>
  </main>

  <!-- Classic scripts (not type="module") so the page works when opened straight from disk -->
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
